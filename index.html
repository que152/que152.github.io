<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แชร์ตำแหน่งแม่พริก - ระบบแชร์พิกัด GPS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    
    <style>
        body { font-family: 'Kanit', sans-serif; }
        .cyber-font { font-family: 'Orbitron', 'Kanit', sans-serif; }
        .dark-panel {
            background: rgba(18, 20, 26, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 242, 254, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .laser-glow {
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
        }
        .laser-btn-glow {
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
        }
        /* ปรับแต่งแผนที่ Leaflet ให้เป็นโทนเข้ม */
        .leaflet-container {
            background: #0f1115 !important;
        }
        .leaflet-tile {
            filter: brightness(0.6) invert(1) contrast(3) grayscale(1) hue-rotate(180deg) saturate(0.3);
        }
    </style>
</head>
<body class="bg-[#0b0c10] min-h-screen text-slate-100 selection:bg-cyan-500 selection:text-black">

    <!-- หน้าต่างเข้าสู่ระบบ (Login Modal) -->
    <div id="login-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-md transition-opacity duration-300">
        <div class="dark-panel p-8 sm:p-10 rounded-2xl w-full max-w-md mx-4 relative overflow-hidden border-2 border-cyan-500/30 laser-glow">
            
            <!-- เอฟเฟกต์แสงไซเบอร์ตรงขอบ -->
            <div class="absolute top-0 left-0 w-full h-[2px] bg-gradient-to-r from-transparent via-cyan-500 to-transparent"></div>
            
            <!-- เรดาร์แอนิเมชัน -->
            <div class="flex justify-center mb-6">
                <div class="relative w-24 h-24 bg-cyan-950/40 rounded-full flex items-center justify-center border-2 border-cyan-500/20">
                    <div class="absolute inset-0 rounded-full border border-cyan-400/40 animate-ping" style="animation-duration: 2.5s;"></div>
                    <div class="absolute inset-2 rounded-full border border-dashed border-cyan-500/30 animate-spin" style="animation-duration: 10s;"></div>
                    
                    <svg class="w-10 h-10 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm1-13h-2v6l5.25 3.15.75-1.23-4.5-2.67z"></path>
                    </svg>
                </div>
            </div>
            
            <!-- หัวเรื่อง -->
            <div class="text-center mb-8">
                <h2 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-blue-500 to-indigo-500 mb-2 tracking-wide font-black">
                    แชร์ตำแหน่งแม่พริก
                </h2>
                <p class="text-slate-400 text-sm font-medium">กรุณาตั้งชื่อของคุณเพื่อเข้าร่วมระบบ</p>
            </div>
            
            <!-- อินพุตชื่อและปุ่มกด -->
            <div class="space-y-5">
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-cyan-500/65" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                        </svg>
                    </div>
                    <input type="text" id="username-input" placeholder="พิมพ์ชื่อของคุณที่นี่..." class="w-full pl-11 pr-4 py-4 bg-slate-900/60 border border-cyan-500/30 rounded-xl text-cyan-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500/80 focus:border-transparent transition-all text-base font-semibold">
                </div>
                
                <button id="join-btn" class="w-full bg-gradient-to-r from-cyan-600 via-blue-600 to-indigo-700 hover:from-cyan-500 hover:via-blue-500 hover:to-indigo-600 text-slate-100 font-extrabold py-4 px-4 rounded-xl shadow-[0_0_20px_rgba(6,182,212,0.15)] hover:shadow-[0_0_25px_rgba(6,182,212,0.4)] transform hover:-translate-y-0.5 transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed flex justify-center items-center gap-2 border border-cyan-400/30">
                    <span>เข้าสู่ระบบแชร์พิกัด</span>
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- แผงแดชบอร์ดหลัก -->
    <div id="dashboard" class="hidden flex-col h-screen max-w-5xl mx-auto p-4 sm:p-6 lg:p-8">
        <header class="flex justify-between items-center mb-6 dark-panel p-5 rounded-2xl shadow-sm border border-cyan-500/20 laser-glow">
            <div>
                <h1 class="text-xl sm:text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 tracking-wide">
                    แชร์ตำแหน่งแม่พริก
                </h1>
                <p id="user-greeting" class="text-xs text-cyan-400 font-mono mt-1"></p>
            </div>
            <button id="toggle-share-btn" class="bg-cyan-500 hover:bg-cyan-400 text-black font-extrabold py-2.5 px-6 rounded-full shadow-md hover:shadow-lg transition-all duration-300 flex items-center gap-2 border border-cyan-300">
                <span id="btn-icon">▶</span>
                <span id="btn-text">เริ่มแชร์ตำแหน่ง</span>
            </button>
        </header>

        <main class="flex-1 flex flex-col lg:flex-row gap-6 overflow-hidden h-full pb-4">
            <!-- คอนเทนเนอร์แผนที่ -->
            <div id="map" class="flex-1 min-h-[400px] rounded-2xl border border-cyan-500/20 z-10 relative"></div>

            <!-- รายชื่อผู้ใช้ -->
            <div class="w-full lg:w-1/3 flex flex-col overflow-y-auto pr-2" style="max-height: calc(100vh - 200px);">
                <h2 class="text-sm font-bold mb-4 text-cyan-400 tracking-wide flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-cyan-500 animate-pulse"></span>
                    ผู้ใช้งานที่กำลังออนไลน์
                </h2>
                <div class="flex flex-col gap-4" id="users-grid"></div>
                <div id="empty-state" class="text-center py-20 text-slate-500 hidden border border-dashed border-slate-800 rounded-2xl">
                    <p>ไม่มีผู้แชร์ตำแหน่งในขณะนี้</p>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // โค้ด Firebase ของคุณ
        const firebaseConfig = {
            apiKey: "AIzaSyAnIepCklRRkruEIx-dUYQJN6g_SKDKACg",
            authDomain: "gpsx-fccc3.firebaseapp.com",
            projectId: "gpsx-fccc3",
            storageBucket: "gpsx-fccc3.firebasestorage.app",
            messagingSenderId: "67663082972",
            appId: "1:67663082972:web:8c03d47e1d07eb0d410b19"
        };

        let app, db, auth;
        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
        } catch (error) {
            console.error("Firebase init error:", error);
            alert("ไม่สามารถเชื่อมต่อระบบได้ กรุณาลองใหม่อีกครั้ง");
        }

        // ตัวแปรเก็บสถานะ (State)
        let userName = "";
        let userId = "";
        let isSharing = false;
        let watchId = null;
        let map = null;
        let markers = {};
        const locationsPath = "gps_locations"; 
        
        const loginModal = document.getElementById('login-modal');
        const usernameInput = document.getElementById('username-input');
        const joinBtn = document.getElementById('join-btn');
        const dashboard = document.getElementById('dashboard');
        const userGreeting = document.getElementById('user-greeting');
        const toggleShareBtn = document.getElementById('toggle-share-btn');
        const btnText = document.getElementById('btn-text');
        const btnIcon = document.getElementById('btn-icon');
        const usersGrid = document.getElementById('users-grid');
        const emptyState = document.getElementById('empty-state');

        async function authenticate() {
            try {
                await signInAnonymously(auth);
                userId = auth.currentUser.uid;
                return true;
            } catch (error) {
                console.error("Authentication failed:", error);
                alert("เชื่อมต่อฐานข้อมูลล้มเหลว กรุณาเช็คอินเตอร์เน็ต");
                return false;
            }
        }

        joinBtn.addEventListener('click', async () => {
            const name = usernameInput.value.trim();
            if (!name) return;
            
            joinBtn.disabled = true;
            joinBtn.textContent = "กำลังเชื่อมต่อสัญญาณ...";

            const authenticated = await authenticate();
            if (authenticated) {
                userName = name;
                loginModal.classList.add('hidden');
                dashboard.classList.remove('hidden');
                dashboard.classList.add('flex');
                userGreeting.textContent = `เชื่อมต่อด้วยชื่อ: ${userName}`;
                
                initMap();
                startListening();
            } else {
                joinBtn.disabled = false;
                joinBtn.textContent = "เข้าสู่ระบบแชร์พิกัด";
            }
        });

        function initMap() {
            if (!map) {
                // พิกัดเริ่มต้นของ ต.แม่พริก อ.แม่พริก จ.ลำปาง
                map = L.map('map').setView([17.4475, 99.1174], 14); 
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '© OpenStreetMap'
                }).addTo(map);
                setTimeout(() => { map.invalidateSize(); }, 100);
            }
        }

        toggleShareBtn.addEventListener('click', () => {
            if (isSharing) stopSharing();
            else startSharing();
        });

        function startSharing() {
            if (!navigator.geolocation) {
                alert("อุปกรณ์ของคุณไม่รองรับ GPS");
                return;
            }

            isSharing = true;
            toggleShareBtn.classList.replace('bg-cyan-500', 'bg-red-600');
            toggleShareBtn.classList.replace('hover:bg-cyan-400', 'hover:bg-red-500');
            toggleShareBtn.classList.replace('text-black', 'text-white');
            toggleShareBtn.classList.add('laser-btn-glow');
            btnText.textContent = "หยุดแชร์ตำแหน่ง";
            btnIcon.textContent = "■";

            const sendLocation = () => {
                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        try {
                            await setDoc(doc(db, locationsPath, userId), {
                                name: userName,
                                lat: position.coords.latitude,
                                lng: position.coords.longitude,
                                timestamp: new Date().toISOString(),
                                userId: userId
                            });
                        } catch (error) {
                            console.error("Error updating location:", error);
                        }
                    },
                    (error) => {
                        console.error("Geolocation error:", error);
                    },
                    { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
                );
            };

            sendLocation();
            watchId = setInterval(sendLocation, 5000);
        }

        async function stopSharing() {
            if (watchId !== null) {
                clearInterval(watchId);
                watchId = null;
            }

            isSharing = false;
            toggleShareBtn.classList.replace('bg-red-600', 'bg-cyan-500');
            toggleShareBtn.classList.replace('hover:bg-red-500', 'hover:bg-cyan-400');
            toggleShareBtn.classList.replace('text-white', 'text-black');
            toggleShareBtn.classList.remove('laser-btn-glow');
            btnText.textContent = "เริ่มแชร์ตำแหน่ง";
            btnIcon.textContent = "▶";

            try {
                await deleteDoc(doc(db, locationsPath, userId));
            } catch (error) {
                console.error("Error removing location:", error);
            }
        }

        function startListening() {
            const locationsRef = collection(db, locationsPath);
            
            onSnapshot(locationsRef, (snapshot) => {
                usersGrid.innerHTML = '';
                const currentUsers = new Set();
                const bounds = [];
                let hasActiveUsers = false;

                snapshot.forEach((doc) => {
                    const data = doc.data();
                    
                    const updateTime = new Date(data.timestamp).getTime();
                    const now = new Date().getTime();
                    if (now - updateTime > 5000) {
                        return; // ตัดออกถ้าพิกัดค้างเกิน 2 นาที
                    }

                    hasActiveUsers = true;
                    currentUsers.add(data.userId);
                    renderUserCard(data);
                    
                    const latLng = [data.lat, data.lng];
                    bounds.push(latLng);

                    if (markers[data.userId]) {
                        markers[data.userId].setLatLng(latLng);
                        markers[data.userId].getPopup().setContent(`<b>${data.name}</b>${data.userId === userId ? ' (คุณ)' : ''}`);
                    } else {
                        // ปรับแต่งไอคอนหมุดเป็นสีฟ้าเรืองแสง
                        const marker = L.marker(latLng).addTo(map);
                        marker.bindPopup(`<b>${data.name}</b>${data.userId === userId ? ' (คุณ)' : ''}`);
                        markers[data.userId] = marker;
                    }
                });
                
                if (!hasActiveUsers) {
                    emptyState.classList.remove('hidden');
                } else {
                    emptyState.classList.add('hidden');
                }
                
                for (const id in markers) {
                    if (!currentUsers.has(id)) {
                        map.removeLayer(markers[id]);
                        delete markers[id];
                    }
                }

                if (bounds.length > 0 && map) {
                    map.fitBounds(bounds, { padding: [50, 50], maxZoom: 16 });
                }
            }, (error) => {
                console.error("Error fetching locations:", error);
            });
        }

        function renderUserCard(userData) {
            const timeAgo = new Date(userData.timestamp).toLocaleTimeString('th-TH');
            const isMe = userData.userId === userId;

            const card = document.createElement('div');
            card.className = `p-5 rounded-2xl shadow-md border ${isMe ? 'bg-cyan-950/20 border-cyan-500/50' : 'bg-[#12141a]/90 border-[#1f242e]'}`;
            
            card.innerHTML = `
                <div class="flex items-center gap-3 mb-3">
                    <div class="w-10 h-10 rounded-full bg-gradient-to-br from-cyan-500 to-blue-600 flex items-center justify-center text-black font-black text-base shadow-lg shadow-cyan-500/10">
                        ${userData.name.charAt(0).toUpperCase()}
                    </div>
                    <div>
                        <h3 class="font-extrabold text-slate-100 flex items-center gap-2">
                            ${userData.name}
                            ${isMe ? '<span class="text-[9px] bg-cyan-500 text-black font-bold px-2 py-0.5 rounded tracking-widest font-mono">คุณ</span>' : ''}
                        </h3>
                        <p class="text-[10px] text-cyan-400 font-mono tracking-wider">อัปเดตล่าสุด: ${timeAgo}</p>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2 text-xs text-slate-300 bg-[#0c0d11] p-3 rounded-xl border border-slate-900">
                    <div>
                        <span class="block text-[10px] tracking-widest text-slate-500 font-bold mb-0.5 font-mono">ละติจูด</span>
                        <span class="font-mono font-semibold text-cyan-200/90">${userData.lat.toFixed(6)}</span>
                    </div>
                    <div>
                        <span class="block text-[10px] tracking-widest text-slate-500 font-bold mb-0.5 font-mono">ลองจิจูด</span>
                        <span class="font-mono font-semibold text-cyan-200/90">${userData.lng.toFixed(6)}</span>
                    </div>
                </div>
            `;
            usersGrid.appendChild(card);
        }

        window.addEventListener('beforeunload', () => {
            if (isSharing) stopSharing();
        });
    </script>
</body>
</html>
