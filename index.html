<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-time GPS Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

    <!-- Login / Name Prompt Modal -->
    <div id="login-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-sm">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md mx-4">
            <h2 class="text-2xl font-bold mb-2 text-slate-800">Welcome</h2>
            <p class="text-slate-500 mb-6">Enter your name to join the live tracker.</p>
            <input type="text" id="username-input" placeholder="Your Name" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all mb-4">
            <button id="join-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-xl transition-colors disabled:opacity-50">Join Tracker</button>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div id="dashboard" class="hidden flex-col h-screen max-w-5xl mx-auto p-4 sm:p-6 lg:p-8">
        <header class="flex justify-between items-center mb-8 glass-panel p-4 rounded-2xl shadow-sm">
            <div>
                <h1 class="text-xl sm:text-2xl font-bold text-slate-800">Live GPS Tracker</h1>
                <p id="user-greeting" class="text-sm text-slate-500"></p>
            </div>
            <button id="toggle-share-btn" class="bg-green-500 hover:bg-green-600 text-white font-semibold py-2 px-6 rounded-full shadow-md transition-all flex items-center gap-2">
                <span id="btn-icon">▶</span>
                <span id="btn-text">Start Sharing</span>
            </button>
        </header>

        <main class="flex-1 flex flex-col lg:flex-row gap-6 overflow-hidden h-full pb-4">
            <!-- Map Container -->
            <div id="map" class="flex-1 min-h-[400px] rounded-2xl shadow-sm border border-slate-200 z-10 relative"></div>

            <!-- User List -->
            <div class="w-full lg:w-1/3 flex flex-col overflow-y-auto pr-2" style="max-height: calc(100vh - 200px);">
                <h2 class="text-lg font-bold mb-4 text-slate-700">Active Users</h2>
                <div class="flex flex-col gap-4" id="users-grid"></div>
                <div id="empty-state" class="text-center py-20 text-slate-400 hidden">
                    <p>No active users sharing their location right now.</p>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // โค้ด Firebase ของคุณ
        const firebaseConfig = {
            apiKey: "AIzaSyAnIepCklRRkruEIx-dUYQJN6g_SKDKACg",
            authDomain: "gpsx-fccc3.firebaseapp.com",
            projectId: "gpsx-fccc3",
            storageBucket: "gpsx-fccc3.firebasestorage.app",
            messagingSenderId: "67663082972",
            appId: "1:67663082972:web:8c03d47e1d07eb0d410b19"
        };

        let app, db, auth;
        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
        } catch (error) {
            console.error("Firebase init error:", error);
            alert("ไม่สามารถเชื่อมต่อ Firebase ได้ กรุณาตรวจสอบ firebaseConfig");
        }

        // State variables
        let userName = "";
        let userId = "";
        let isSharing = false;
        let watchId = null;
        let map = null;
        let markers = {};
        const locationsPath = "gps_locations"; 
        
        const loginModal = document.getElementById('login-modal');
        const usernameInput = document.getElementById('username-input');
        const joinBtn = document.getElementById('join-btn');
        const dashboard = document.getElementById('dashboard');
        const userGreeting = document.getElementById('user-greeting');
        const toggleShareBtn = document.getElementById('toggle-share-btn');
        const btnText = document.getElementById('btn-text');
        const btnIcon = document.getElementById('btn-icon');
        const usersGrid = document.getElementById('users-grid');
        const emptyState = document.getElementById('empty-state');

        async function authenticate() {
            try {
                await signInAnonymously(auth);
                userId = auth.currentUser.uid;
                return true;
            } catch (error) {
                console.error("Authentication failed:", error);
                alert("เชื่อมต่อฐานข้อมูลล้มเหลว ตรวจสอบว่าเปิดโหมด Anonymous ใน Firebase หรือยัง");
                return false;
            }
        }

        joinBtn.addEventListener('click', async () => {
            const name = usernameInput.value.trim();
            if (!name) return;
            
            joinBtn.disabled = true;
            joinBtn.textContent = "Connecting...";

            const authenticated = await authenticate();
            if (authenticated) {
                userName = name;
                loginModal.classList.add('hidden');
                dashboard.classList.remove('hidden');
                dashboard.classList.add('flex');
                userGreeting.textContent = `Tracking as ${userName}`;
                
                initMap();
                startListening();
            } else {
                joinBtn.disabled = false;
                joinBtn.textContent = "Join Tracker";
            }
        });

        function initMap() {
            if (!map) {
                map = L.map('map').setView([13.7563, 100.5018], 5); // ศูนย์กลางแผนที่ประเทศไทย
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '© OpenStreetMap'
                }).addTo(map);
                setTimeout(() => { map.invalidateSize(); }, 100);
            }
        }

        toggleShareBtn.addEventListener('click', () => {
            if (isSharing) stopSharing();
            else startSharing();
        });

        function startSharing() {
            if (!navigator.geolocation) {
                alert("อุปกรณ์ของคุณไม่รองรับ GPS");
                return;
            }

            isSharing = true;
            toggleShareBtn.classList.replace('bg-green-500', 'bg-red-500');
            toggleShareBtn.classList.replace('hover:bg-green-600', 'hover:bg-red-600');
            btnText.textContent = "Stop Sharing";
            btnIcon.textContent = "■";

            // ฟังก์ชันสำหรับดึงและส่งตำแหน่ง
            const sendLocation = () => {
                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        try {
                            await setDoc(doc(db, locationsPath, userId), {
                                name: userName,
                                lat: position.coords.latitude,
                                lng: position.coords.longitude,
                                timestamp: new Date().toISOString(),
                                userId: userId
                            });
                        } catch (error) {
                            console.error("Error updating location:", error);
                        }
                    },
                    (error) => {
                        console.error("Geolocation error:", error);
                        // ไม่ต้อง stopSharing() ทันที เผื่อแค่สัญญาณหายชั่วคราว
                    },
                    { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
                );
            };

            // เรียกใช้ทันที 1 ครั้งเมื่อกดปุ่ม
            sendLocation();
            
            // สั่งให้ดึงตำแหน่งใหม่ทุกๆ 5 วินาที (5000 มิลลิวินาที)
            watchId = setInterval(sendLocation, 5000);
        }

        async function stopSharing() {
            if (watchId !== null) {
                clearInterval(watchId); // หยุดการส่งข้อมูลเมื่อกด Stop
                watchId = null;
            }

            isSharing = false;
            toggleShareBtn.classList.replace('bg-red-500', 'bg-green-500');
            toggleShareBtn.classList.replace('hover:bg-red-600', 'hover:bg-green-600');
            btnText.textContent = "Start Sharing";
            btnIcon.textContent = "▶";

            try {
                await deleteDoc(doc(db, locationsPath, userId));
            } catch (error) {
                console.error("Error removing location:", error);
            }
        }

        function startListening() {
            const locationsRef = collection(db, locationsPath);
            
            onSnapshot(locationsRef, (snapshot) => {
                usersGrid.innerHTML = '';
                const currentUsers = new Set();
                const bounds = [];
                let hasActiveUsers = false;

                snapshot.forEach((doc) => {
                    const data = doc.data();
                    
                    // เช็คว่าข้อมูลเก่าเกิน 2 นาที (120,000 มิลลิวินาที) หรือไม่
                    const updateTime = new Date(data.timestamp).getTime();
                    const now = new Date().getTime();
                    if (now - updateTime > 120000) {
                        return; // ถ้าเก่าเกิน 2 นาที ให้ข้ามการแสดงผลไปเลย ไม่โชว์บนจอ
                    }

                    hasActiveUsers = true;
                    currentUsers.add(data.userId);
                    renderUserCard(data);
                    
                    const latLng = [data.lat, data.lng];
                    bounds.push(latLng);

                    if (markers[data.userId]) {
                        markers[data.userId].setLatLng(latLng);
                        markers[data.userId].getPopup().setContent(`<b>${data.name}</b>${data.userId === userId ? ' (You)' : ''}`);
                    } else {
                        const marker = L.marker(latLng).addTo(map);
                        marker.bindPopup(`<b>${data.name}</b>${data.userId === userId ? ' (You)' : ''}`);
                        markers[data.userId] = marker;
                    }
                });
                
                if (!hasActiveUsers) {
                    emptyState.classList.remove('hidden');
                } else {
                    emptyState.classList.add('hidden');
                }
                
                for (const id in markers) {
                    if (!currentUsers.has(id)) {
                        map.removeLayer(markers[id]);
                        delete markers[id];
                    }
                }

                if (bounds.length > 0 && map) {
                    map.fitBounds(bounds, { padding: [50, 50], maxZoom: 16 });
                }
            }, (error) => {
                console.error("Error fetching locations:", error);
            });
        }

        function renderUserCard(userData) {
            const timeAgo = new Date(userData.timestamp).toLocaleTimeString();
            const isMe = userData.userId === userId;

            const card = document.createElement('div');
            card.className = `p-5 rounded-2xl shadow-sm border ${isMe ? 'bg-blue-50 border-blue-200' : 'bg-white border-slate-100'}`;
            
            card.innerHTML = `
                <div class="flex items-center gap-3 mb-3">
                    <div class="w-10 h-10 rounded-full bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-white font-bold text-sm shadow-inner">
                        ${userData.name.charAt(0).toUpperCase()}
                    </div>
                    <div>
                        <h3 class="font-bold text-slate-800 flex items-center gap-2">
                            ${userData.name}
                            ${isMe ? '<span class="text-[10px] bg-blue-100 text-blue-800 px-2 py-0.5 rounded-full uppercase tracking-wider">You</span>' : ''}
                        </h3>
                        <p class="text-xs text-slate-400">อัปเดตล่าสุด: ${timeAgo}</p>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2 text-sm text-slate-600 bg-slate-50 p-3 rounded-xl border border-slate-100">
                    <div>
                        <span class="block text-[10px] uppercase tracking-wider text-slate-400 font-semibold mb-0.5">ละติจูด</span>
                        <span class="font-mono">${userData.lat.toFixed(6)}</span>
                    </div>
                    <div>
                        <span class="block text-[10px] uppercase tracking-wider text-slate-400 font-semibold mb-0.5">ลองจิจูด</span>
                        <span class="font-mono">${userData.lng.toFixed(6)}</span>
                    </div>
                </div>
            `;
            usersGrid.appendChild(card);
        }

        window.addEventListener('beforeunload', () => {
            if (isSharing) stopSharing();
        });
    </script>
</body>
</html>
